title = "booking-platform-backend gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "booking-platform-opaque-token"
description = "Token opaco de booking-platform (sesión bp_s_, verificación de email bp_ev_, reset bp_pr_)"
regex = '''bp_(s|ev|pr)_[A-Za-z0-9_-]{43}'''
keywords = ["bp_s_", "bp_ev_", "bp_pr_"]

[[rules]]
id = "whatsapp-cloud-api-access-token"
description = "Token de acceso de Meta (WhatsApp Cloud API)"
regex = '''EAA[A-Za-z0-9]{100,}'''
keywords = ["EAA"]
