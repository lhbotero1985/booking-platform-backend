# QA stack (T3.2). Lives on the server at /opt/booking/qa/ next to its .env (generated by
# deploy/server/qa-env.sh, never in Git). Synthetic data only.
#
#   docker compose up -d                       # postgres, api, worker, mailpit
#   docker compose run --rm migrate up         # migrations with the migrator role
#
# Sized for a 1 GB Droplet + 2 GB swap (P34). Nothing is published on public interfaces:
# Caddy (T3.3) will be the only service exposing 80/443. Docker bypasses ufw, so every port
# below is bound to 127.0.0.1.
name: booking-qa

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

x-app-env: &app-env
  APP_ENV: qa
  LOG_LEVEL: info
  # Runtime role: DML only (no DDL); see qa/initdb/10-app-roles.sh.
  DATABASE_URL: postgres://app_runtime:${APP_RUNTIME_PASSWORD:?missing}@postgres:5432/booking?sslmode=disable
  DB_MAX_CONNS: "8"
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?missing}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  # Mailpit on the private network: no real email ever leaves QA.
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_TLS: none
  SMTP_FROM: Reservas QA <no-reply@booking-platform-col.duckdns.org>

services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?missing}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?missing}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?missing}
    # Small-memory tuning (1 GB host shared with the API, worker and Caddy).
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_connections=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./qa/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_admin -d booking"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    security_opt: [no-new-privileges:true]
    mem_limit: 320m
    shm_size: 64m
    stop_grace_period: 60s
    restart: unless-stopped

  # One-off: docker compose run --rm migrate up|status. Only this service knows the migrator
  # password; the long-running api/worker never receive it.
  migrate:
    image: ${API_IMAGE:?missing}
    profiles: [tools]
    entrypoint: ["/usr/local/bin/api", "migrate"]
    environment:
      APP_ENV: qa
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?missing}
      DATABASE_URL: postgres://app_migrator:${APP_MIGRATOR_PASSWORD:?missing}@postgres:5432/booking?sslmode=disable
      DATABASE_MIGRATOR_URL: postgres://app_migrator:${APP_MIGRATOR_PASSWORD:?missing}@postgres:5432/booking?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    <<: *hardening
    restart: "no"
    mem_limit: 128m

  api:
    image: ${API_IMAGE:?missing}
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      # One Argon2id hash (64 MiB) at a time on a 1 GB host; GOMEMLIMIT keeps the Go heap
      # below the container limit.
      ARGON2_MAX_CONCURRENT: "1"
      GOMEMLIMIT: 180MiB
    ports:
      - "127.0.0.1:8080:8080" # smoke tests from the host; Caddy (T3.3) uses the network
    depends_on:
      postgres:
        condition: service_healthy
    <<: *hardening
    mem_limit: 256m
    pids_limit: 200
    stop_grace_period: 25s

  worker:
    image: ${API_IMAGE:?missing}
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      <<: *app-env
      WORKER_SHUTDOWN_TIMEOUT: 20s
      ARGON2_MAX_CONCURRENT: "1"
      GOMEMLIMIT: 110MiB
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    <<: *hardening
    mem_limit: 160m
    pids_limit: 200
    stop_grace_period: 30s

  # Mail catcher. UI only on 127.0.0.1: reach it with
  #   ssh -L 8025:127.0.0.1:8025 deploy@booking-platform-col.duckdns.org
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:8025:8025"
    tmpfs:
      - /tmp
    <<: *hardening
    mem_limit: 64m

volumes:
  pgdata:
