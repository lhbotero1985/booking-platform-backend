# https://taskfile.dev — multiplataforma (Windows / Linux / CI)
version: "3"

vars:
  MODULE: github.com/lhbotero1985/booking-platform-backend
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  LDFLAGS: -s -w -X {{.MODULE}}/internal/platform/buildinfo.version={{.VERSION}} -X {{.MODULE}}/internal/platform/buildinfo.commit={{.COMMIT}}

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Compila api y worker en ./bin
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/ ./cmd/...

  fmt:
    desc: Formatea el código (gofmt + goimports vía golangci-lint)
    cmds:
      - golangci-lint fmt

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  lint:
    desc: golangci-lint (incluye gosec y reglas de arquitectura)
    cmds:
      - golangci-lint run

  test:
    desc: Pruebas unitarias
    cmds:
      - go test -count=1 ./...

  test:security:
    desc: Línea base de seguridad HTTP (cabeceras, fugas, CORS, límites, slowloris, inyección en logs)
    cmds:
      - go test -count=1 -v ./tests/security/...

  openapi:lint:
    desc: Valida api/openapi.yaml (esquema OpenAPI 3.1 + convenciones) y el contrato de las respuestas
    cmds:
      - go test -count=1 ./api/... ./internal/app/... -run 'TestSpec|TestContract' -v

  sqlc:
    desc: Genera código Go desde db/queries con SQLC
    cmds:
      - sqlc generate

  sqlc:check:
    desc: Verifica que el código SQLC generado esté al día y que las consultas sean válidas
    cmds:
      - sqlc vet
      - sqlc diff

  test:integration:
    desc: Pruebas de integración contra PostgreSQL real (testcontainers; requiere Docker)
    vars:
      # Endpoint of the active Docker context. Passing it explicitly avoids testcontainers'
      # auto-detection, which intermittently fails on Docker Desktop for Windows when several
      # packages start containers at once ("rootless Docker is not supported on Windows").
      DOCKER_ENDPOINT:
        sh: docker context inspect --format '{{"{{"}}.Endpoints.docker.Host{{"}}"}}'
    env:
      DOCKER_HOST: "{{.DOCKER_ENDPOINT}}"
    cmds:
      - go test -tags=integration -count=1 -timeout=10m ./...

  test:race:
    desc: Pruebas con detector de carreras (requiere cgo; en Windows sin gcc solo corre en CI)
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race -count=1 ./...

  test:cover:
    desc: Pruebas con cobertura
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  vuln:
    desc: Vulnerabilidades alcanzables en dependencias y stdlib
    cmds:
      - govulncheck ./...

  secrets:
    desc: Escaneo de secretos con gitleaks (requiere Docker en ejecución)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact

  # --- Docker / entorno DEV -------------------------------------------------
  docker:build:
    desc: Construye la imagen booking-platform-backend:dev
    cmds:
      - docker build -f deploy/docker/Dockerfile --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.COMMIT}} -t booking-platform-backend:dev .

  up:
    desc: Levanta el entorno DEV (PostgreSQL/PostGIS + API)
    preconditions:
      - sh: test -f .env
        msg: "Falta .env — copiar .env.example a .env"
    env:
      VERSION: "{{.VERSION}}"
      COMMIT: "{{.COMMIT}}"
    cmds:
      - docker compose -f deploy/compose/docker-compose.dev.yml --env-file .env up -d --build --wait

  migrate:
    desc: "Migraciones en el entorno DEV (uso: task migrate -- up|down|status)"
    cmds:
      - docker compose -f deploy/compose/docker-compose.dev.yml --env-file .env run --rm api migrate {{.CLI_ARGS | default "up"}}

  down:
    desc: Detiene el entorno DEV (conserva el volumen de datos)
    cmds:
      - docker compose -f deploy/compose/docker-compose.dev.yml --env-file .env down

  logs:
    desc: Sigue los logs del entorno DEV
    cmds:
      - docker compose -f deploy/compose/docker-compose.dev.yml --env-file .env logs -f

  trivy:
    desc: Escanea Dockerfile/compose (config) y la imagen DEV (HIGH/CRITICAL con fix)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/src" aquasec/trivy:{{.TRIVY_VERSION}} config --exit-code 1 --severity HIGH,CRITICAL /src/deploy
      - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:{{.TRIVY_VERSION}} image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 booking-platform-backend:dev
    vars:
      TRIVY_VERSION: 0.76.2

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  check:
    desc: Verificación completa local (build, vet, lint, test, vuln)
    cmds:
      - task: build
      - task: vet
      - task: lint
      - task: test
      - task: vuln
