  /api/v1/businesses/{slug}/availability:
    get:
      tags: [Availability]
      operationId: getPublicAvailability
      summary: Bookable start times of a professional for a service on a local day (public)
      description: |
        Informative (the booking revalidates). Working ranges and breaks of the weekday minus
        absences and booked appointments, on a grid of the business's slot interval anchored to
        each working range, with its buffer, minimum notice and booking horizon. Times are UTC
        (`startAt`, `endAt`) plus `startLocal` with the business's offset. 404, identical for a
        business customers cannot see, an unknown or inactive service, a professional who does
        not perform it or is not bookable. 400 `DATE_OUTSIDE_BOOKING_WINDOW` for a date before
        today or beyond the horizon (in the business's calendar).
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: professionalId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          description: Local day of the business (YYYY-MM-DD).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The bookable start times, earliest first (empty when nothing is free).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/appointments:
    post:
      tags: [Appointments]
      operationId: bookAppointment
      summary: Book a slot (customer)
      description: |
        The authenticated customer (verified email and a phone set with `PUT /api/v1/me/phone`)
        books a start time offered by the public availability. The slot is revalidated inside
        the transaction under the professional's lock; the database rejects any overlap
        (ADR-0004). The appointment starts `PENDING_CONFIRMATION` with a snapshot of the service
        (name, duration, price). Repeating the request with the same `Idempotency-Key` returns
        the same appointment; the same key with a different body is 422 `IDEMPOTENCY_KEY_REUSED`.
        Errors: 404 (business, service or professional not bookable, indistinguishable), 400
        `DATE_OUTSIDE_BOOKING_WINDOW`, 409 `SLOT_UNAVAILABLE`, 422 `PHONE_REQUIRED`, 503
        `AGENDA_BUSY` (retry after `Retry-After`).
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per booking attempt (8-100 characters, letters, digits, - and _).
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{8,100}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [businessId, serviceId, professionalId, startAt]
              properties:
                businessId:
                  type: string
                  format: uuid
                serviceId:
                  type: string
                  format: uuid
                professionalId:
                  type: string
                  format: uuid
                startAt:
                  type: string
                  format: date-time
                  description: A `startAt` returned by the availability.
      responses:
        "201":
          description: The appointment (also on an idempotent replay).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

