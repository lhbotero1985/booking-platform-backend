                  format: uuid

  responses:
    Unauthorized:
      description: |
        Missing or invalid credentials (`UNAUTHENTICATED`, `INVALID_CREDENTIALS`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        Authenticated but not allowed (`EMAIL_NOT_VERIFIED`, `CSRF_REJECTED`, …).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Accepted:
      description: Request accepted. The same response is returned whether or not the email exists.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptedResponse"
    BadRequest:
      description: |
        Invalid input (`INVALID_REQUEST` with `errors[]`) or invalid token (`INVALID_TOKEN`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request body exceeds the configured limit (`BODY_TOO_LARGE`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The body must be `application/json` (`UNSUPPORTED_MEDIA_TYPE`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist (also returned for resources of another business).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: |
        Rate limit or progressive login backoff reached (`RATE_LIMITED`). The response is the
        same whether or not the account exists. Retry after `Retry-After` seconds.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: The request is understood but cannot be processed (`PHONE_REQUIRED`, `IDEMPOTENCY_KEY_REUSED`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Temporarily unable to serve (`AGENDA_BUSY`); retry after `Retry-After` seconds.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        A record with the same code or name already exists (`ALREADY_EXISTS`), a country,
        division or city with active businesses cannot be deactivated (`IN_USE`), a business
        cannot be activated while its location is inactive (`LOCATION_INACTIVE`), the account
        already owns a business (`ALREADY_OWNER`), the subscription is not a demo
        (`NOT_EXTENDABLE`), the account is already a member (`ALREADY_MEMBER`) or the change
        would leave the business without an OWNER (`LAST_OWNER`), or the account already has a
        professional profile in the business (`ALREADY_PROFESSIONAL`), or the start time is not
        available (`SLOT_UNAVAILABLE`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: The path exists but does not support this method. `Allow` lists valid methods.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Allow:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotReady:
      description: A dependency is not ready (code `NOT_READY`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  securitySchemes:
    # Declared now for the frontends; applied to operations from Phase 2 (ADR-0006).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque session token (mobile apps).
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: HttpOnly session cookie (web portals), with CSRF protection on mutations.
