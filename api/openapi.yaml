  /api/v1/business/{businessId}/professionals/{professionalId}/services:
    parameters:
      - name: businessId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: professionalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Catalog]
      operationId: listProfessionalServices
      summary: Services a professional performs (OWNER, PROFESSIONAL)
      description: Ordered by `sortOrder` and name.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: The services of the professional.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogServiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Catalog]
      operationId: replaceProfessionalServices
      summary: Set the services a professional performs (OWNER)
      description: |
        Replaces the whole list (an empty list removes every service). Every id must be a
        service of the same business (`SERVICE_NOT_FOUND` at `serviceIds[i]`); duplicates are
        ignored; at most 200. Audited.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalServicesRequest"
      responses:
        "200":
          description: The services of the professional now in force.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogServiceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

components:
  parameters:
    CountryCode:
      name: code
      in: path
      required: true
      description: ISO 3166-1 alpha-2 code, upper case.
      schema:
        type: string
        pattern: "^[A-Z]{2}$"
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    XRequestID:
      description: Correlation ID of the request (client-supplied if valid, otherwise generated).
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          const: ok
        version:
          type: string
          description: Build version of the running binary.
          examples: ["v0.1.0", "dev"]

    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ready

    Problem:
      type: object
      description: RFC 9457 problem details with project extensions.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          examples: ["about:blank"]
        title:
          type: string
          examples: ["Not Found"]
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation. Never contains internal error messages.
        instance:
          type: string
          description: Request path that produced the problem.
        code:
          type: string
          description: Stable machine-readable error code for clients.
          pattern: "^[A-Z][A-Z0-9_]*$"
          examples: ["NOT_FOUND", "SLOT_UNAVAILABLE", "INVALID_REQUEST"]
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
          description: Stable field error code (e.g. INVALID_EMAIL, PASSWORD_TOO_SHORT, REQUIRED).

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, fullName, phone]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: 8–128 characters; common passwords are rejected. No composition rules.
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          maxLength: 32
          description: |
            Mobile number, mandatory (T6.4). Normalized to E.164: a 10-digit Colombian mobile
            (`3XX XXX XXXX`) gets `+57`. Field codes `REQUIRED`, `INVALID_PHONE`.

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Token from the emailed link (`bp_ev_…`).
          writeOnly: true

    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: accepted

    VerifiedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: verified

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, clientType]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 128
          writeOnly: true
        clientType:
          type: string
          enum: [MOBILE, WEB]

    LoginResponse:
      type: object
      additionalProperties: false
      required: [expiresAt, idleExpiresAt]
      properties:
        tokenType:
          const: Bearer
          description: MOBILE only.
        token:
          type: string
          description: "MOBILE only. Opaque session token (`bp_s_…`), sent as `Authorization: Bearer <token>`."
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry of the session.
        idleExpiresAt:
          type: string
          format: date-time
          description: Expiry if there is no activity (slides with use).

    LogoutAllResponse:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked:
          type: integer
          minimum: 0

    MeResponse:
      type: object
      additionalProperties: false
      required: [id, email, fullName, phone, status, isPlatformAdmin, emailVerifiedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: [string, "null"]
          description: Mobile in E.164 (T6.3); required to book.
          pattern: "^\\+[1-9][0-9]{6,14}$"
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED]
        isPlatformAdmin:
          type: boolean
        emailVerifiedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    MembershipsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Membership"

    Membership:
      type: object
      additionalProperties: false
      required: [businessId, role]
      properties:
        businessId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, PROFESSIONAL]

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          writeOnly: true
          description: Token from the emailed link (`bp_pr_…`).
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    PasswordResetResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: password_reset

    Country:
      type: object
      additionalProperties: false
      required: [code, name, phoneCode, defaultCurrency, active]
      properties:
        code:
          type: string
          pattern: "^[A-Z]{2}$"
        name:
          type: string
        phoneCode:
          type: string
          pattern: "^\\+[1-9][0-9]{0,3}$"
        defaultCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
        active:
          type: boolean

    CountryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Country"

    Division:
      type: object
      additionalProperties: false
      required: [id, countryCode, code, name, type, active]
      properties:
        id:
          type: string
          format: uuid
        countryCode:
          type: string
          pattern: "^[A-Z]{2}$"
        code:
          type: [string, "null"]
          description: ISO 3166-2 code (e.g. `CO-VAC`), if any.
        name:
          type: string
        type:
          $ref: "#/components/schemas/DivisionType"
        active:
          type: boolean

    DivisionType:
      type: string
      enum: [DEPARTMENT, STATE, PROVINCE, REGION, DISTRICT]

    DivisionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Division"

    City:
      type: object
      additionalProperties: false
      required: [id, divisionId, name, timeZone, active]
      properties:
        id:
          type: string
          format: uuid
        divisionId:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
          description: IANA time zone (e.g. `America/Bogota`); default for businesses in the city.
        active:
          type: boolean

    CityList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/City"

    CreateCountryRequest:
      type: object
      additionalProperties: false
      required: [code, name, phoneCode, defaultCurrency]
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2.
        name:
          type: string
          maxLength: 100
        phoneCode:
          type: string
          description: International calling code, e.g. `+57`.
        defaultCurrency:
          type: string
          description: ISO 4217 code from the supported list (`COP`, `USD`).
        active:
          type: boolean
          default: true

    UpdateCountryRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        phoneCode:
          type: string
        defaultCurrency:
          type: string
        active:
          type: boolean

    CreateDivisionRequest:
      type: object
      additionalProperties: false
      required: [countryCode, name, type]
      properties:
        countryCode:
          type: string
        code:
          type: string
          description: Optional ISO 3166-2 code of the same country.
        name:
          type: string
          maxLength: 100
        type:
          $ref: "#/components/schemas/DivisionType"
        active:
          type: boolean
          default: true

    UpdateDivisionRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        name:
          type: string
          maxLength: 100
        type:
          $ref: "#/components/schemas/DivisionType"
        active:
          type: boolean

    CreateCityRequest:
      type: object
      additionalProperties: false
      required: [divisionId, name, timeZone]
      properties:
        divisionId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        timeZone:
          type: string
        active:
          type: boolean
          default: true

    UpdateCityRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        timeZone:
          type: string
        active:
          type: boolean

    BusinessStatus:
      type: string
      enum: [PENDING_REVIEW, ACTIVE, SUSPENDED]

    Coordinates:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    BusinessLocation:
      type: object
      additionalProperties: false
      required: [countryCode, divisionId, cityId, addressLine, coordinates]
      properties:
        countryCode:
          type: string
          pattern: "^[A-Z]{2}$"
        divisionId:
          type: string
          format: uuid
        cityId:
          type: string
          format: uuid
        addressLine:
          type: string
        coordinates:
          oneOf:
            - $ref: "#/components/schemas/Coordinates"
            - type: "null"

    BookingPolicy:
      type: object
      additionalProperties: false
      required: [slotIntervalMinutes, bufferMinutes, minLeadMinutes, maxAdvanceDays,
                 cancellationCutoffHours, rescheduleCutoffHours, requireCustomerConfirmation]
      properties:
        slotIntervalMinutes:
          type: integer
          enum: [5, 10, 15, 20]
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 60
        minLeadMinutes:
          type: integer
          minimum: 0
          maximum: 10080
        maxAdvanceDays:
          type: integer
          minimum: 1
          maximum: 365
        cancellationCutoffHours:
          type: integer
          minimum: 0
          maximum: 168
        rescheduleCutoffHours:
          type: integer
          minimum: 0
          maximum: 168
        requireCustomerConfirmation:
          type: boolean

    Reminders:
      type: object
      additionalProperties: false
      required: [enabled, hoursBefore]
      properties:
        enabled:
          type: boolean
        hoursBefore:
          type: integer
          minimum: 1
          maximum: 72

    Business:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, contactPhone, description, location, timeZone, currency,
                 bookingPolicy, reminders, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,58}[a-z0-9]$"
        status:
          $ref: "#/components/schemas/BusinessStatus"
        contactPhone:
          type: string
          description: E.164.
          pattern: "^\\+[1-9][0-9]{6,14}$"
        description:
          type: string
        location:
          $ref: "#/components/schemas/BusinessLocation"
        timeZone:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        bookingPolicy:
          $ref: "#/components/schemas/BookingPolicy"
        reminders:
          $ref: "#/components/schemas/Reminders"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BusinessList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Business"
        nextCursor:
          type: string

    CreateBusinessRequest:
      type: object
      additionalProperties: false
      required: [name, contactPhone, cityId, addressLine, ownerEmail]
      properties:
        name:
          type: string
          maxLength: 120
        contactPhone:
          type: string
          description: National (country of the city) or international format; stored as E.164.
        description:
          type: string
          maxLength: 1000
        cityId:
          type: string
          format: uuid
        addressLine:
          type: string
          maxLength: 200
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        ownerEmail:
          type: string
          description: Email of an active (verified) account that becomes OWNER.

    CreateOwnBusinessRequest:
      type: object
      additionalProperties: false
      required: [name, contactPhone, cityId, addressLine]
      properties:
        name:
          type: string
          maxLength: 120
        contactPhone:
          type: string
        description:
          type: string
          maxLength: 1000
        cityId:
          type: string
          format: uuid
        addressLine:
          type: string
          maxLength: 200
        coordinates:
          $ref: "#/components/schemas/Coordinates"

    Subscription:
      type: object
      additionalProperties: false
      required: [businessId, status, trialEndsAt, expiredAt, entitled]
      properties:
        businessId:
          type: string
          format: uuid
        status:
          type: string
          enum: [TRIALING, ACTIVE, PAST_DUE, EXPIRED, CANCELED]
        trialEndsAt:
          type: [string, "null"]
          format: date-time
        expiredAt:
          type: [string, "null"]
          format: date-time
        entitled:
          type: boolean
          description: Whether the business may be visible and take bookings now.

    ExtendTrialRequest:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 90

    SubscriptionSummary:
      type: object
      additionalProperties: false
      required: [status, trialEndsAt, entitled]
      properties:
        status:
          type: string
          enum: [TRIALING, ACTIVE, PAST_DUE, EXPIRED, CANCELED, ""]
        trialEndsAt:
          type: [string, "null"]
          format: date-time
        entitled:
          type: boolean

    ManagedBusiness:
      type: object
      additionalProperties: false
      required: [business, subscription]
      properties:
        business:
          $ref: "#/components/schemas/Business"
        subscription:
          $ref: "#/components/schemas/SubscriptionSummary"

    UpdateBusinessRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
        contactPhone:
          type: string
        description:
          type: string
          maxLength: 1000
        cityId:
          type: string
          format: uuid
        addressLine:
          type: string
          maxLength: 200
        coordinates:
          oneOf:
            - $ref: "#/components/schemas/Coordinates"
            - type: "null"
        bookingPolicy:
          type: object
          additionalProperties: false
          properties:
            slotIntervalMinutes:
              type: integer
              enum: [5, 10, 15, 20]
            bufferMinutes:
              type: integer
            minLeadMinutes:
              type: integer
            maxAdvanceDays:
              type: integer
            cancellationCutoffHours:
              type: integer
            rescheduleCutoffHours:
              type: integer
            requireCustomerConfirmation:
              type: boolean
        reminders:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            hoursBefore:
              type: integer

    MemberRole:
      type: string
      enum: [OWNER, PROFESSIONAL]
      description: OWNER is the person in charge of the business (several allowed, at least one).

    Member:
      type: object
      additionalProperties: false
      required: [userId, fullName, email, role, since]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        since:
          type: string
          format: date-time

    MemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"

    AddMemberResponse:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MemberRole"

    ChangeMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/MemberRole"

    PublicBusiness:
      type: object
      additionalProperties: false
      required: [id, name, slug, description, contactPhone, location, timeZone, currency, bookingPolicy]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        contactPhone:
          type: string
        location:
          $ref: "#/components/schemas/BusinessLocation"
        timeZone:
          type: string
        currency:
          type: string
        bookingPolicy:
          type: object
          additionalProperties: false
          required: [minLeadMinutes, maxAdvanceDays, cancellationCutoffHours, rescheduleCutoffHours]
          properties:
            minLeadMinutes:
              type: integer
            maxAdvanceDays:
              type: integer
            cancellationCutoffHours:
              type: integer
            rescheduleCutoffHours:
              type: integer

    PublicBusinessList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicBusiness"
        nextCursor:
          type: string

    Professional:
      type: object
      additionalProperties: false
      required: [id, userId, displayName, bio, status, sortOrder, memberActive, bookable, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        bio:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
        memberActive:
          type: boolean
          description: The account is still a member of the business.
        bookable:
          type: boolean
          description: ACTIVE and still a member.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProfessionalList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Professional"

    CreateProfessionalRequest:
      type: object
      additionalProperties: false
      required: [email, displayName]
      properties:
        email:
          type: string
        displayName:
          type: string
          maxLength: 60
        bio:
          type: string
          maxLength: 500
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000

    UpdateProfessionalRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          maxLength: 60
        bio:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000

    LocalTimeRange:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "09:00"
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "13:00"

    ScheduleDay:
      type: object
      additionalProperties: false
      required: [weekday]
      properties:
        weekday:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        workingHours:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/LocalTimeRange"
        breaks:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/LocalTimeRange"

    WeeklyScheduleRequest:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/ScheduleDay"

    WeeklySchedule:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            allOf:
              - $ref: "#/components/schemas/ScheduleDay"
              - required: [weekday, workingHours, breaks]

    AbsenceRequest:
      type: object
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
