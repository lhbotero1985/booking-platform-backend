    parameters:
      - name: businessId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: professionalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Professionals]
      operationId: getProfessionalSchedule
      summary: Weekly schedule of a professional (OWNER, PROFESSIONAL)
      description: |
        Working ranges and recurring breaks per weekday, in the business's local time (its IANA
        time zone). Always the seven days, Monday first; a day without working ranges is a day off.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: The weekly schedule.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Professionals]
      operationId: replaceProfessionalSchedule
      summary: Replace the weekly schedule (OWNER, or the professional itself)
      description: |
        Replaces the whole week in one transaction; omitted days become days off. Rules: times
        `HH:MM` without crossing midnight, `start < end`, at most 6 working ranges and 6 breaks
        per day, working ranges of a day do not overlap (touching is allowed), breaks do not
        overlap and each lies inside a working range. Field errors use paths such as
        `days[0].breaks[1]` with codes `INVALID_WEEKDAY`, `DUPLICATE_WEEKDAY`, `INVALID_TIME`,
        `INVALID_RANGE`, `TOO_MANY_RANGES`, `OVERLAPPING_RANGES`, `BREAK_OUTSIDE_WORKING_HOURS`.
        A PROFESSIONAL may only replace its own schedule (403). Audited.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyScheduleRequest"
      responses:
        "200":
          description: The schedule now in force.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

