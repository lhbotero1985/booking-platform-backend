openapi: 3.1.0
info:
  title: Booking Platform API
  version: 0.1.0
  summary: Multi-tenant booking API for barbershops, beauty salons and similar businesses.
  description: |
    Contract-first REST API (ADR-0011). This document is the source of truth: handlers must
    conform to it and contract tests validate real responses against it.

    Conventions (docs/architecture/api-design.md):
    - Errors use RFC 9457 `application/problem+json` with a stable `code` and the `requestId`.
    - Instants are RFC 3339 in UTC; money is `{ amountMinor, currency }`.
    - Every response carries `X-Request-ID`.
    - Unknown paths answer 404 and unsupported methods 405 (with `Allow`), both as `Problem`;
      they are generic and therefore not listed per operation.
    - Every route except the health probes is rate limited per client (IPv4 address or IPv6
      /64): over the limit it answers 429 `RATE_LIMITED` with `Retry-After` (seconds). This
      general limit is not listed per operation; the stricter limit of the credential and email
      endpoints (and the login backoff) is.
servers:
  - url: http://localhost:8080
    description: DEV (Docker Compose)

tags:
  - name: Operations
    description: Liveness and readiness probes. Public, no authentication.
  - name: Auth
    description: |
      Registration and email verification. Accounts start `PENDING_VERIFICATION` and must verify
      their email before the first login. Responses never reveal whether an email is registered.

  - name: Geography
    description: |
      Countries, administrative divisions and cities (reference data). Reads are public and
      return active records only; writes under `/api/v1/admin` require `PLATFORM_ADMIN`
      (403 `FORBIDDEN` otherwise) and are audited. An area with active businesses cannot be
      deactivated (409 `IN_USE`).

paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness probe
      description: Reports that the process serves HTTP. Does not check dependencies.
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Reports whether the instance can receive traffic: the database answers and there are
        no pending migrations. Each check is bounded by a 2 second timeout. The failing check is
        named but its internal error is never exposed.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register an account
      description: |
        Creates a `PENDING_VERIFICATION` account and emails a verification link. When the email
        is already registered the response is identical (anti-enumeration); a pending account
        receives a new link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify the email with the emailed token
      description: |
        Activates the account. Tokens are single-use and expire after 24 hours. Unknown,
        malformed, expired and used tokens all return `INVALID_TOKEN`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified; the account is active.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/verify-email/resend:
    post:
      tags: [Auth]
      operationId: resendVerificationEmail
      summary: Resend the verification email
      description: |
        Always `202` for well-formed emails. A new link is sent only if the account exists and is
        pending; requests for the same account are coalesced to one per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Opens a session for a verified account. `MOBILE` clients receive a Bearer token in the
        body. `WEB` clients receive it only in the `__Host-session` cookie (HttpOnly, Secure,
        SameSite=Lax) and never in the body. Unknown email, wrong password and suspended
        accounts all return `INVALID_CREDENTIALS` with comparable timing. `EMAIL_NOT_VERIFIED` is
        returned only after a correct password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session opened.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              description: "`__Host-session` for WEB clients only."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      description: Cookie sessions must send an allowed `Origin` (CSRF protection).
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "204":
          description: Session revoked; the session cookie is cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Revoke every session of the account
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Sessions revoked; the session cookie is cleared.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutAllResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current account
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: The authenticated account.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/memberships:
    get:
      tags: [Auth]
      operationId: listMyMemberships
      summary: Businesses and roles of the current account
      description: |
        Active memberships only, sorted by `businessId`. Customers have none (empty list).
        Roles are read from the database on every request, so a revoked membership disappears
        immediately. Not paginated (a user belongs to a handful of businesses at most).
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: The caller's active memberships.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email
      description: |
        Always `202` for well-formed emails. A reset link (single use, 30 minutes) is emailed only
        to active accounts; requests are coalesced to one per minute per account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with the emailed token
      description: |
        Revokes every session of the account and clears the session cookie. The password policy
        is checked before the token is consumed. Invalid, expired or used tokens return
        `INVALID_TOKEN`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password changed; all sessions revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the password of the current account
      description: |
        Requires the current password. Other sessions are revoked; the current one stays.
        Field codes: `INVALID_CURRENT_PASSWORD`, `PASSWORD_UNCHANGED`, password policy codes.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"


  /api/v1/countries:
    get:
      tags: [Geography]
      operationId: listCountries
      summary: Active countries
      description: Sorted by name. Not paginated (small reference list).
      security: []
      responses:
        "200":
          description: Active countries.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryList"

  /api/v1/countries/{code}/divisions:
    get:
      tags: [Geography]
      operationId: listDivisions
      summary: Active administrative divisions of a country
      description: Sorted by name. Unknown or inactive country → 404.
      security: []
      parameters:
        - $ref: "#/components/parameters/CountryCode"
      responses:
        "200":
          description: Active divisions of the country.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DivisionList"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/divisions/{id}/cities:
    get:
      tags: [Geography]
      operationId: listCities
      summary: Active cities of a division
      description: Sorted by name. Unknown or inactive division (or country) → 404.
      security: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Active cities of the division.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityList"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/countries:
    post:
      tags: [Geography]
      operationId: createCountry
      summary: Create a country (PLATFORM_ADMIN)
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCountryRequest"
      responses:
        "201":
          description: Country created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/v1/admin/countries/{code}:
    patch:
      tags: [Geography]
      operationId: updateCountry
      summary: Update a country (PLATFORM_ADMIN)
      description: Only the fields present change. The code cannot change.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CountryCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCountryRequest"
      responses:
        "200":
          description: The updated country.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/v1/admin/divisions:
    post:
      tags: [Geography]
      operationId: createDivision
      summary: Create an administrative division (PLATFORM_ADMIN)
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDivisionRequest"
      responses:
        "201":
          description: Division created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Division"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/v1/admin/divisions/{id}:
    patch:
      tags: [Geography]
      operationId: updateDivision
      summary: Update an administrative division (PLATFORM_ADMIN)
      description: Only the fields present change; `code` "" removes the ISO code. It cannot move to another country.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDivisionRequest"
      responses:
        "200":
          description: The updated division.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Division"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/v1/admin/cities:
    post:
      tags: [Geography]
      operationId: createCity
      summary: Create a city (PLATFORM_ADMIN)
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCityRequest"
      responses:
        "201":
          description: City created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/v1/admin/cities/{id}:
    patch:
      tags: [Geography]
      operationId: updateCity
      summary: Update a city (PLATFORM_ADMIN)
      description: Only the fields present change. It cannot move to another division.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCityRequest"
      responses:
        "200":
          description: The updated city.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

components:
  parameters:
    CountryCode:
      name: code
      in: path
      required: true
      description: ISO 3166-1 alpha-2 code, upper case.
      schema:
        type: string
        pattern: "^[A-Z]{2}$"
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    XRequestID:
      description: Correlation ID of the request (client-supplied if valid, otherwise generated).
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          const: ok
        version:
          type: string
          description: Build version of the running binary.
          examples: ["v0.1.0", "dev"]

    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ready

    Problem:
      type: object
      description: RFC 9457 problem details with project extensions.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          examples: ["about:blank"]
        title:
          type: string
          examples: ["Not Found"]
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation. Never contains internal error messages.
        instance:
          type: string
          description: Request path that produced the problem.
        code:
          type: string
          description: Stable machine-readable error code for clients.
          pattern: "^[A-Z][A-Z0-9_]*$"
          examples: ["NOT_FOUND", "SLOT_UNAVAILABLE", "INVALID_REQUEST"]
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
          description: Stable field error code (e.g. INVALID_EMAIL, PASSWORD_TOO_SHORT, REQUIRED).

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: 8–128 characters; common passwords are rejected. No composition rules.
        fullName:
          type: string
          minLength: 1
          maxLength: 120

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Token from the emailed link (`bp_ev_…`).
          writeOnly: true

    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: accepted

    VerifiedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: verified

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, clientType]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 128
          writeOnly: true
        clientType:
          type: string
          enum: [MOBILE, WEB]

    LoginResponse:
      type: object
      additionalProperties: false
      required: [expiresAt, idleExpiresAt]
      properties:
        tokenType:
          const: Bearer
          description: MOBILE only.
        token:
          type: string
          description: "MOBILE only. Opaque session token (`bp_s_…`), sent as `Authorization: Bearer <token>`."
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry of the session.
        idleExpiresAt:
          type: string
          format: date-time
          description: Expiry if there is no activity (slides with use).

    LogoutAllResponse:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked:
          type: integer
          minimum: 0

    MeResponse:
      type: object
      additionalProperties: false
      required: [id, email, fullName, status, isPlatformAdmin, emailVerifiedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED]
        isPlatformAdmin:
          type: boolean
        emailVerifiedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    MembershipsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Membership"

    Membership:
      type: object
      additionalProperties: false
      required: [businessId, role]
      properties:
        businessId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, MANAGER, PROFESSIONAL]

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          writeOnly: true
          description: Token from the emailed link (`bp_pr_…`).
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    PasswordResetResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: password_reset

    Country:
      type: object
      additionalProperties: false
      required: [code, name, phoneCode, defaultCurrency, active]
      properties:
        code:
          type: string
          pattern: "^[A-Z]{2}$"
        name:
          type: string
        phoneCode:
          type: string
          pattern: "^\\+[1-9][0-9]{0,3}$"
        defaultCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
        active:
          type: boolean

    CountryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Country"

    Division:
      type: object
      additionalProperties: false
      required: [id, countryCode, code, name, type, active]
      properties:
        id:
          type: string
          format: uuid
        countryCode:
          type: string
          pattern: "^[A-Z]{2}$"
        code:
          type: [string, "null"]
          description: ISO 3166-2 code (e.g. `CO-VAC`), if any.
        name:
          type: string
        type:
          $ref: "#/components/schemas/DivisionType"
        active:
          type: boolean

    DivisionType:
      type: string
      enum: [DEPARTMENT, STATE, PROVINCE, REGION, DISTRICT]

    DivisionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Division"

    City:
      type: object
      additionalProperties: false
      required: [id, divisionId, name, timeZone, active]
      properties:
        id:
          type: string
          format: uuid
        divisionId:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
          description: IANA time zone (e.g. `America/Bogota`); default for businesses in the city.
        active:
          type: boolean

    CityList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/City"

    CreateCountryRequest:
      type: object
      additionalProperties: false
      required: [code, name, phoneCode, defaultCurrency]
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2.
        name:
          type: string
          maxLength: 100
        phoneCode:
          type: string
          description: International calling code, e.g. `+57`.
        defaultCurrency:
          type: string
          description: ISO 4217 code from the supported list (`COP`, `USD`).
        active:
          type: boolean
          default: true

    UpdateCountryRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        phoneCode:
          type: string
        defaultCurrency:
          type: string
        active:
          type: boolean

    CreateDivisionRequest:
      type: object
      additionalProperties: false
      required: [countryCode, name, type]
      properties:
        countryCode:
          type: string
        code:
          type: string
          description: Optional ISO 3166-2 code of the same country.
        name:
          type: string
          maxLength: 100
        type:
          $ref: "#/components/schemas/DivisionType"
        active:
          type: boolean
          default: true

    UpdateDivisionRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        name:
          type: string
          maxLength: 100
        type:
          $ref: "#/components/schemas/DivisionType"
        active:
          type: boolean

    CreateCityRequest:
      type: object
      additionalProperties: false
      required: [divisionId, name, timeZone]
      properties:
        divisionId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        timeZone:
          type: string
        active:
          type: boolean
          default: true

    UpdateCityRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        timeZone:
          type: string
        active:
          type: boolean

  responses:
    Unauthorized:
      description: |
        Missing or invalid credentials (`UNAUTHENTICATED`, `INVALID_CREDENTIALS`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        Authenticated but not allowed (`EMAIL_NOT_VERIFIED`, `CSRF_REJECTED`, …).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Accepted:
      description: Request accepted. The same response is returned whether or not the email exists.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptedResponse"
    BadRequest:
      description: |
        Invalid input (`INVALID_REQUEST` with `errors[]`) or invalid token (`INVALID_TOKEN`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request body exceeds the configured limit (`BODY_TOO_LARGE`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The body must be `application/json` (`UNSUPPORTED_MEDIA_TYPE`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist (also returned for resources of another business).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: |
        Rate limit or progressive login backoff reached (`RATE_LIMITED`). The response is the
        same whether or not the account exists. Retry after `Retry-After` seconds.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        A record with the same code or name already exists (`ALREADY_EXISTS`), or a country,
        division or city with active businesses cannot be deactivated (`IN_USE`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: The path exists but does not support this method. `Allow` lists valid methods.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Allow:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotReady:
      description: A dependency is not ready (code `NOT_READY`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  securitySchemes:
    # Declared now for the frontends; applied to operations from Phase 2 (ADR-0006).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque session token (mobile apps).
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: HttpOnly session cookie (web portals), with CSRF protection on mutations.
