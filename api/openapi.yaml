        - name: date
          in: query
          required: false
          description: Any local day inside the period (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: professionalId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 1–500, default 100.
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: A page of the agenda.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
