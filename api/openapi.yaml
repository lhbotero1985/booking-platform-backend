      operationId: searchBusinesses
      summary: Search businesses customers can book (public)
      description: |
        `ACTIVE` businesses of a city whose demo is running or whose subscription is paid
        (ADR-0018) and that have something to book (T5.7: an `ACTIVE` service performed by a
        bookable professional), ordered by name; optional text filter on the name. Keyset pagination with
        `cursor` (opaque). A page may hold fewer than `limit` items and still have `nextCursor`.
      security: []
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: 2–60 characters contained in the name (case-insensitive).
          schema:
            type: string
        - name: cursor
          in: query
          schema:
