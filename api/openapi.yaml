        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Businesses]
      operationId: createOwnBusiness
      summary: Create your own business (self-service, 7-day demo)
      description: |
        The authenticated (verified) account becomes OWNER of a new `ACTIVE` business with a
        7-day demo subscription; business, membership, subscription and audit entries are created
        atomically. One per account: an account that already owns a business gets 409
        `ALREADY_OWNER` (another one is requested from support). Strict per-client rate limit.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
