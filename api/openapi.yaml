    get:
      tags: [Appointments]
      operationId: getAgenda
      summary: Agenda of the business (OWNER every professional, PROFESSIONAL its own)
      description: |
        Appointments (every status) starting in a day, a week (Monday to Sunday), a month or a
        year of the business's calendar, by start, paginated. A PROFESSIONAL sees only its own
        agenda (asking for another professional is 403); the OWNER sees every professional's,
