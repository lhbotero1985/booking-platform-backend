  /api/v1/business/{businessId}/appointments:
    parameters:
      - name: businessId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Appointments]
      operationId: bookManualAppointment
      summary: Book a customer of your business (OWNER any agenda, PROFESSIONAL its own)
      description: |
        Manual booking by the staff (T6.4): a start time on the professional's grid inside its
        working hours, not overlapping breaks, absences or active appointments, without the
        minimum notice (the customer may be present) and whether or not the business is public.
        `confirmed` (default `true`) books it `CONFIRMED`; `false` leaves it
        `PENDING_CONFIRMATION`. Same guarantees and `Idempotency-Key` semantics as the customer
        booking. A PROFESSIONAL booking another professional's agenda gets 403. Field codes
        `CUSTOMER_NOT_FOUND`, `CUSTOMER_OR_CUSTOMER_ID`, `PROFESSIONAL_NOT_BOOKABLE`,
        `SERVICE_NOT_BOOKABLE`, and `customer.fullName` / `customer.phone` / `customer.email`
        (`REQUIRED`, `INVALID_NAME`, `INVALID_PHONE`, `INVALID_EMAIL`).
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{8,100}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [professionalId, serviceId, startAt]
              description: Give `customer` (the quick way) or `customerId`, not both.
              properties:
                professionalId:
                  type: string
                  format: uuid
                serviceId:
                  type: string
                  format: uuid
                customer:
                  type: object
                  additionalProperties: false
                  required: [fullName, phone]
                  description: |
                    The customer typed in the booking: name and mobile mandatory, email
                    optional. A customer of the business with that mobile is reused (its email
                    is completed if it had none); otherwise it is created.
                  properties:
                    fullName:
                      type: string
                      maxLength: 120
                    phone:
                      type: string
                      maxLength: 32
                    email:
                      type: string
                      maxLength: 254
                customerId:
                  type: string
                  format: uuid
                  description: An existing customer of the business.
                startAt:
                  type: string
                  format: date-time
                confirmed:
                  type: boolean
                  default: true
      responses:
        "201":
          description: The appointment (also on an idempotent replay).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

