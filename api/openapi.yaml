      summary: What customers can book in a business (public)
      description: |
        ACTIVE services performed by at least one bookable professional (profile ACTIVE and still
        a member), those professionals with the services each performs, and the ACTIVE categories
        in use. Ordered by sort order and name. No accounts, emails, statuses or timestamps. 404
