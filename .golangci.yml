version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec          # SAST
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - errorlint
    - errname
    - nilerr
    - exhaustive
    - gocritic
    - misspell
    - unconvert
    - revive
    - depguard
    - forbidigo
  settings:
    depguard:
      rules:
        # El dominio es puro: sin infraestructura, HTTP ni base de datos (ADR-0002).
        domain-purity:
          list-mode: lax
          files:
            - "**/internal/modules/*/domain/**"
          deny:
            - pkg: net/http
              desc: el dominio no depende de HTTP
            - pkg: database/sql
              desc: el dominio no depende de la base de datos
            - pkg: github.com/jackc/pgx
              desc: el dominio no depende de la base de datos
            - pkg: github.com/riverqueue/river
              desc: el dominio no depende de River
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/platform
              desc: el dominio no depende de la plataforma técnica
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/app
              desc: el dominio no depende del composition root

        # Casos de uso: sin transporte ni drivers; dependen de puertos (ADR-0002).
        application-layer:
          list-mode: lax
          files:
            - "**/internal/modules/*/application/**"
          deny:
            - pkg: net/http
              desc: la aplicación no depende de HTTP (eso vive en interfaces/http)
            - pkg: database/sql
              desc: la aplicación usa puertos, no la base de datos
            - pkg: github.com/jackc/pgx
              desc: la aplicación usa puertos, no la base de datos
            - pkg: github.com/riverqueue/river
              desc: la aplicación usa puertos, no River directamente
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/platform/httpx
              desc: la aplicación no depende de HTTP

        # Fronteras del módulo identity: solo puede importarse a sí mismo (y en el futuro el
        # paquete contract de otros módulos, que se agregará aquí como allow explícito).
        identity-module-boundary:
          list-mode: lax
          files:
            - "**/internal/modules/identity/**"
          allow:
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/identity
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules
              desc: los módulos se comunican solo vía su paquete contract

        # Dirección de dependencias dentro de identity (Clean Architecture: hacia el dominio).
        identity-domain-inward:
          list-mode: lax
          files:
            - "**/internal/modules/identity/domain/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/application
              desc: el dominio no conoce los casos de uso
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/infrastructure
              desc: el dominio no conoce la infraestructura
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/interfaces
              desc: el dominio no conoce el transporte
        identity-application-inward:
          list-mode: lax
          files:
            - "**/internal/modules/identity/application/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/infrastructure
              desc: la aplicación depende de puertos, no de su implementación
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/interfaces
              desc: la aplicación no conoce el transporte

        # Fronteras del módulo geography (T4.1): se importa a sí mismo y el contract de identity.
        geography-module-boundary:
          list-mode: lax
          files:
            - "**/internal/modules/geography/**"
          allow:
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/geography
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/contract
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules
              desc: los módulos se comunican solo vía su paquete contract
        geography-domain-inward:
          list-mode: lax
          files:
            - "**/internal/modules/geography/domain/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/geography/application
              desc: el dominio no conoce los casos de uso
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/geography/infrastructure
              desc: el dominio no conoce la infraestructura
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/geography/interfaces
              desc: el dominio no conoce el transporte
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity
              desc: el dominio de geography no depende de otros módulos
        geography-application-inward:
          list-mode: lax
          files:
            - "**/internal/modules/geography/application/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/geography/infrastructure
              desc: la aplicación depende de puertos, no de su implementación
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/geography/interfaces
              desc: la aplicación no conoce el transporte

        # Fronteras del módulo businesses (T4.2): se importa a sí mismo y los contract de
        # identity y geography.
        businesses-module-boundary:
          list-mode: lax
          files:
            - "**/internal/modules/businesses/**"
          allow:
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/businesses
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/contract
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/geography/contract
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/subscriptions/contract
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/catalog/contract
            # Reseñas (2026-11-28): las vistas públicas muestran las calificaciones.
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/scheduling/contract
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules
              desc: los módulos se comunican solo vía su paquete contract
        businesses-domain-inward:
          list-mode: lax
          files:
            - "**/internal/modules/businesses/domain/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/businesses/application
              desc: el dominio no conoce los casos de uso
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/businesses/infrastructure
              desc: el dominio no conoce la infraestructura
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/businesses/interfaces
              desc: el dominio no conoce el transporte
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity
              desc: el dominio de businesses no depende de otros módulos
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/geography
              desc: el dominio de businesses no depende de otros módulos
        businesses-application-inward:
          list-mode: lax
          files:
            - "**/internal/modules/businesses/application/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/businesses/infrastructure
              desc: la aplicación depende de puertos, no de su implementación
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/businesses/interfaces
              desc: la aplicación no conoce el transporte

        # Fronteras del módulo subscriptions (T4.3b, ADR-0018).
        subscriptions-module-boundary:
          list-mode: lax
          files:
            - "**/internal/modules/subscriptions/**"
          allow:
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/subscriptions
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/contract
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules
              desc: los módulos se comunican solo vía su paquete contract
        subscriptions-domain-inward:
          list-mode: lax
          files:
            - "**/internal/modules/subscriptions/domain/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/subscriptions/application
              desc: el dominio no conoce los casos de uso
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/subscriptions/infrastructure
              desc: el dominio no conoce la infraestructura
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity
              desc: el dominio de subscriptions no depende de otros módulos
        subscriptions-application-inward:
          list-mode: lax
          files:
            - "**/internal/modules/subscriptions/application/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/subscriptions/infrastructure
              desc: la aplicación depende de puertos, no de su implementación
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/subscriptions/interfaces
              desc: la aplicación no conoce el transporte

        # Fronteras del módulo professionals (T5.2).
        professionals-module-boundary:
          list-mode: lax
          files:
            - "**/internal/modules/professionals/**"
          allow:
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/professionals
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/contract
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/scheduling/contract
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules
              desc: los módulos se comunican solo vía su paquete contract
        professionals-domain-inward:
          list-mode: lax
          files:
            - "**/internal/modules/professionals/domain/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/professionals/application
              desc: el dominio no conoce los casos de uso
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/professionals/infrastructure
              desc: el dominio no conoce la infraestructura
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity
              desc: el dominio de professionals no depende de otros módulos
        professionals-application-inward:
          list-mode: lax
          files:
            - "**/internal/modules/professionals/application/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/professionals/infrastructure
              desc: la aplicación depende de puertos, no de su implementación
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/professionals/interfaces
              desc: la aplicación no conoce el transporte
        # Fronteras del módulo catalog (T5.5).
        catalog-module-boundary:
          list-mode: lax
          files:
            - "**/internal/modules/catalog/**"
          allow:
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/catalog
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/contract
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/businesses/contract
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/professionals/contract
            # Reseñas (2026-11-28): el catálogo público muestra la calificación de cada profesional.
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/scheduling/contract
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules
              desc: los módulos se comunican solo vía su paquete contract
        catalog-domain-inward:
          list-mode: lax
          files:
            - "**/internal/modules/catalog/domain/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/catalog/application
              desc: el dominio no conoce los casos de uso
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/catalog/infrastructure
              desc: el dominio no conoce la infraestructura
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity
              desc: el dominio de catalog no depende de otros módulos
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/businesses
              desc: el dominio de catalog no depende de otros módulos
        catalog-application-inward:
          list-mode: lax
          files:
            - "**/internal/modules/catalog/application/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/catalog/infrastructure
              desc: la aplicación depende de puertos, no de su implementación
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/catalog/interfaces
              desc: la aplicación no conoce el transporte
        # Fronteras del módulo scheduling (T6.1).
        scheduling-module-boundary:
          list-mode: lax
          files:
            - "**/internal/modules/scheduling/**"
          allow:
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/scheduling
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/contract
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/businesses/contract
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/professionals/contract
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/catalog/contract
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules
              desc: los módulos se comunican solo vía su paquete contract
        scheduling-domain-inward:
          list-mode: lax
          files:
            - "**/internal/modules/scheduling/domain/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/scheduling/application
              desc: el dominio no conoce los casos de uso
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/scheduling/infrastructure
              desc: el dominio no conoce la infraestructura
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity
              desc: el dominio de scheduling no depende de otros módulos
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/businesses
              desc: el dominio de scheduling no depende de otros módulos
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/professionals
              desc: el dominio de scheduling no depende de otros módulos
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/catalog
              desc: el dominio de scheduling no depende de otros módulos
        scheduling-application-inward:
          list-mode: lax
          files:
            - "**/internal/modules/scheduling/application/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/scheduling/infrastructure
              desc: la aplicación depende de puertos, no de su implementación
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/scheduling/interfaces
              desc: la aplicación no conoce el transporte
        # Fronteras del módulo notifications (T7.1): lee scheduling, identity y (T7.4) businesses
        # por su contract.
        notifications-module-boundary:
          list-mode: lax
          files:
            - "**/internal/modules/notifications/**"
          allow:
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/notifications
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/identity/contract
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/scheduling/contract
            - github.com/lhbotero1985/booking-platform-backend/internal/modules/businesses/contract
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules
              desc: los módulos se comunican solo vía su paquete contract
        notifications-domain-inward:
          list-mode: lax
          files:
            - "**/internal/modules/notifications/domain/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/notifications/application
              desc: el dominio no conoce los casos de uso
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/notifications/infrastructure
              desc: el dominio no conoce la infraestructura
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/identity
              desc: el dominio de notifications no depende de otros módulos
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/scheduling
              desc: el dominio de notifications no depende de otros módulos
        notifications-application-inward:
          list-mode: lax
          files:
            - "**/internal/modules/notifications/application/**"
          deny:
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/notifications/infrastructure
              desc: la aplicación depende de puertos, no de su implementación
            - pkg: github.com/lhbotero1985/booking-platform-backend/internal/modules/notifications/interfaces
              desc: la aplicación no conoce el transporte
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: usar log/slog
    exhaustive:
      default-signifies-exhaustive: true
    misspell:
      locale: US
      # Spanish words of the user-facing texts (emails and pages).
      ignore-rules: [confirmas, cancelas]
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests use synthetic connection strings; real secrets are caught by gitleaks.
      - path: _test\.go
        linters: [gosec]
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lhbotero1985/booking-platform-backend
